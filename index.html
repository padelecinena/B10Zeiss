const state = { modelo: null, fase: "", bdg: "", fecha: "", histFrom: "grid", editingRef: null };
let historialActual = [];

/* ---------- Navegación entre pantallas ---------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function fmtTol(p) {
  const n = p.nominal.toLocaleString("es-ES", { minimumFractionDigits: 0 });
  const t = p.tol.toLocaleString("es-ES", { minimumFractionDigits: 0 });
  return `${n} ±${t}`;
}

function buildGrid() {
  const groups = state.modelo === "B10" ? GROUPS_B10 : GROUPS_B05;
  const wrap = document.getElementById("grid");
  wrap.innerHTML = "";
  groups.forEach(group => {
    const gEl = document.createElement("div");
    gEl.className = "group";
    const header = document.createElement("div");
    header.className = "group-header";
    header.style.background = group.color;
    const headerText = document.createElement("span");
    headerText.textContent = group.name;
    header.appendChild(headerText);
    if (group.img && GROUP_IMAGES[group.img]) {
      const thumb = document.createElement("img");
      thumb.src = GROUP_IMAGES[group.img];
      thumb.className = "group-thumb";
      thumb.alt = "Zona: " + group.name;
      thumb.addEventListener("click", () => openLightbox(GROUP_IMAGES[group.img], group.name));
      header.appendChild(thumb);
    }
    gEl.appendChild(header);

    group.points.forEach(p => {
      const row = document.createElement("div");
      row.className = "point-row" + (p.ref ? " ref-row" : "");
      const label = document.createElement("div");
      label.className = "point-label";
      label.innerHTML = `<span class="point-id">${p.id}</span><span class="point-nom">${fmtTol(p)}</span>`;
      row.appendChild(label);

      if (p.ref) {
        const refTag = document.createElement("div");
        refTag.className = "ref-tag";
        refTag.textContent = "REFERENTIEL";
        row.appendChild(refTag);
      } else {
        ["L", "R"].forEach(side => {
          const cell = document.createElement("div");
          cell.className = "cota-cell";

          const signBtn = document.createElement("button");
          signBtn.type = "button";
          signBtn.className = "sign-btn";
          signBtn.textContent = "±";
          signBtn.tabIndex = -1;

          const inp = document.createElement("input");
          inp.type = "text";
          inp.inputMode = "decimal";
          inp.placeholder = side;
          inp.className = "cota-input";
          inp.dataset.id = p.id;
          inp.dataset.side = side;
          inp.dataset.nominal = p.nominal;
          inp.dataset.tol = p.tol;

          signBtn.addEventListener("click", () => {
            const v = inp.value.trim().replace(",", ".");
            if (v === "" || v === "-") {
              inp.value = v === "-" ? "" : "-";
            } else {
              const n = parseFloat(v);
              if (!isNaN(n)) inp.value = (-n).toString().replace(".", ",");
            }
            evalInput(inp);
            inp.focus();
          });

          inp.addEventListener("input", () => {
            // Solo permite dígitos, una coma/punto y un signo negativo al inicio
            let v = inp.value.replace(/[^0-9,.\-]/g, "");
            v = v.replace(/(?!^)-/g, "");
            const firstSep = v.search(/[,.]/);
            if (firstSep !== -1) {
              v = v.slice(0, firstSep + 1) + v.slice(firstSep + 1).replace(/[,.]/g, "");
            }
            inp.value = v;
            evalInput(inp);
          });
          inp.addEventListener("keydown", e => {
            if (e.key === "Enter") {
              e.preventDefault();
              focusNext(inp);
            }
          });

          cell.appendChild(signBtn);
          cell.appendChild(inp);
          row.appendChild(cell);
        });
      }
      gEl.appendChild(row);
    });
    wrap.appendChild(gEl);
  });
}

function evalInput(inp) {
  const val = inp.value.trim().replace(",", ".");
  inp.classList.remove("ok", "high", "low");
  if (val === "" || val === "-") return;
  const num = parseFloat(val);
  if (isNaN(num)) return;
  const nominal = parseFloat(inp.dataset.nominal);
  const tol = parseFloat(inp.dataset.tol);
  if (num > nominal + tol) {
    inp.classList.add("high");
  } else if (num < nominal - tol) {
    inp.classList.add("low");
  } else {
    inp.classList.add("ok");
  }
}

function rellenarGridConValores(valores) {
  const inputs = Array.from(document.querySelectorAll(".cota-input"));
  inputs.forEach(inp => {
    const key = `${inp.dataset.id}_${inp.dataset.side}`;
    const v = valores ? valores[key] : undefined;
    if (v !== undefined && v !== null) {
      inp.value = v.toString().replace(".", ",");
      evalInput(inp);
    } else {
      inp.value = "";
      inp.classList.remove("ok", "high", "low");
    }
  });
}

function openLightbox(src, title) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightboxTitle").textContent = title;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
}

function focusNext(current) {
  const inputs = Array.from(document.querySelectorAll(".cota-input"));
  const idx = inputs.indexOf(current);
  if (idx >= 0 && idx < inputs.length - 1) {
    inputs[idx + 1].focus();
    inputs[idx + 1].select();
  } else {
    current.blur();
  }
}

/* ---------- Guardado ---------- */
async function guardar() {
  const inputs = Array.from(document.querySelectorAll(".cota-input"));
  const valores = {};
  let rellenos = 0;
  let fueraAlta = 0;
  let fueraBaja = 0;
  inputs.forEach(inp => {
    const val = inp.value.trim().replace(",", ".");
    if (val === "" || val === "-") return;
    const num = parseFloat(val);
    if (isNaN(num)) return;
    rellenos++;
    if (inp.classList.contains("high")) fueraAlta++;
    if (inp.classList.contains("low")) fueraBaja++;
    const key = `${inp.dataset.id}_${inp.dataset.side}`;
    valores[key] = num;
  });

  if (rellenos === 0) {
    alert("No hay ninguna cota rellenada todavía.");
    return;
  }

  const btn = document.getElementById("btnGuardar");
  const editando = !!state.editingRef;
  btn.disabled = true;
  btn.textContent = editando ? "Actualizando…" : "Guardando…";
  try {
    const datos = {
      modelo: state.modelo,
      fase: state.fase,
      bdg: state.bdg,
      fecha: state.fecha,
      valores,
      totalCotas: rellenos,
      fueraTolerancia: fueraAlta + fueraBaja,
      fueraAlta,
      fueraBaja,
    };
    if (editando) {
      datos.actualizado = serverTimestamp();
      await updateDoc(state.editingRef, datos);
      document.getElementById("saveMsg").textContent =
        `Actualizado ✓ (${rellenos} cotas, ${fueraAlta + fueraBaja} fuera de tolerancia)`;
    } else {
      const colName = state.modelo === "B10" ? "zeiss_b10" : "zeiss_b05";
      datos.creado = serverTimestamp();
      await addDoc(collection(db, colName), datos);
      document.getElementById("saveMsg").textContent =
        `Guardado ✓ (${rellenos} cotas, ${fueraAlta + fueraBaja} fuera de tolerancia)`;
    }
    document.getElementById("saveMsg").className = "save-msg ok-msg";
  } catch (err) {
    console.error(err);
    document.getElementById("saveMsg").textContent = "Error al guardar: " + err.message;
    document.getElementById("saveMsg").className = "save-msg bad-msg";
  } finally {
    btn.disabled = false;
    btn.textContent = editando ? "Actualizar medición" : "Guardar medición";
  }
}

/* ---------- Historial ---------- */
async function cargarHistorial() {
  const list = document.getElementById("histList");
  list.innerHTML = "<p class='muted'>Cargando…</p>";
  list.classList.remove("select-mode");
  document.getElementById("btnSelectMode").textContent = "✉️ Enviar varias";
  document.getElementById("sendBar").classList.remove("active");
  try {
    const colName = state.modelo === "B10" ? "zeiss_b10" : "zeiss_b05";
    const q = query(collection(db, colName), orderBy("creado", "desc"), limit(20));
    const snap = await getDocs(q);
    if (snap.empty) {
      list.innerHTML = "<p class='muted'>Sin registros todavía.</p>";
      return;
    }
    list.innerHTML = "";
    historialActual = [];
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const idx = historialActual.length;
      const fecha = d.creado?.toDate ? d.creado.toDate().toLocaleString("es-ES") : d.fecha || "";
      historialActual.push({ docSnap, d, fecha });

      const row = document.createElement("div");
      row.className = "hist-row";

      const selectWrap = document.createElement("label");
      selectWrap.className = "hist-select";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.dataset.idx = idx;
      checkbox.addEventListener("change", updateSendBar);
      selectWrap.appendChild(checkbox);
      row.appendChild(selectWrap);

      const info = document.createElement("div");
      info.className = "hist-info";
      info.innerHTML = `
        <div><strong>${d.modelo}</strong> · FASE ${d.fase || "-"} · BDG ${d.bdg || "-"}</div>
        <div class="muted">${fecha} — ${d.totalCotas || 0} cotas, ${d.fueraTolerancia || 0} fuera de tolerancia (🔴 ${d.fueraAlta || 0}  🔵 ${d.fueraBaja || 0})</div>
      `;
      row.appendChild(info);

      const btnRow = document.createElement("div");
      btnRow.className = "hist-btn-row";

      const editBtn = document.createElement("button");
      editBtn.className = "btn btn-secondary hist-edit-btn";
      editBtn.textContent = "✏️ Editar";
      editBtn.addEventListener("click", () => {
        state.modelo = d.modelo;
        state.fase = d.fase || "";
        state.bdg = d.bdg || "";
        state.fecha = d.fecha || "";
        state.editingRef = docSnap.ref;
        document.getElementById("topBar").textContent =
          `Editando: ${state.modelo} · FASE ${state.fase || "-"} · BDG ${state.bdg} (${fecha})`;
        buildGrid();
        rellenarGridConValores(d.valores);
        document.getElementById("saveMsg").textContent = "";
        document.getElementById("btnGuardar").textContent = "Actualizar medición";
        show("screen-grid");
      });

      const pdfBtn = document.createElement("button");
      pdfBtn.className = "btn btn-secondary hist-pdf-btn";
      pdfBtn.textContent = "Generar PDF";
      pdfBtn.addEventListener("click", () => generarInformePDF(d, fecha));

      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-danger hist-del-btn";
      delBtn.textContent = "🗑 Borrar";
      delBtn.addEventListener("click", async () => {
        const ok = confirm(`¿Borrar esta carrocería?\n\n${d.modelo} · FASE ${d.fase || "-"} · BDG ${d.bdg || "-"}\n${fecha}\n\nEsta acción no se puede deshacer.`);
        if (!ok) return;
        delBtn.disabled = true;
        delBtn.textContent = "Borrando…";
        try {
          await deleteDoc(docSnap.ref);
          row.remove();
        } catch (err) {
          alert("Error al borrar: " + err.message);
          delBtn.disabled = false;
          delBtn.textContent = "🗑 Borrar";
        }
      });

      btnRow.appendChild(editBtn);
      btnRow.appendChild(pdfBtn);
      btnRow.appendChild(delBtn);
      row.appendChild(btnRow);
      list.appendChild(row);
    });
  } catch (err) {
    list.innerHTML = "<p class='muted'>Error cargando historial: " + err.message + "</p>";
  }
}

/* ---------- Tendencias / gráficos ---------- */
async function cargarGrafico() {
  const container = document.getElementById("chartsContainer");
  container.innerHTML = "<p class='muted'>Cargando…</p>";
  document.getElementById("chartsModelo").textContent = state.modelo;
  const n = parseInt(document.getElementById("graficoN").value, 10) || 10;
  try {
    const colName = state.modelo === "B10" ? "zeiss_b10" : "zeiss_b05";
    const q = query(collection(db, colName), orderBy("creado", "desc"), limit(n));
    const snap = await getDocs(q);
    const records = [];
    snap.forEach(doc => records.push(doc.data()));
    records.reverse(); // orden cronológico
    renderGraficos(records);
  } catch (err) {
    container.innerHTML = "<p class='muted'>Error cargando datos: " + err.message + "</p>";
  }
}

function renderGraficos(records) {
  const groups = state.modelo === "B10" ? GROUPS_B10 : GROUPS_B05;
  const container = document.getElementById("chartsContainer");
  container.innerHTML = "";

  if (records.length === 0) {
    container.innerHTML = "<p class='muted'>No hay mediciones guardadas todavía para este modelo.</p>";
    return;
  }

  groups.forEach(group => {
    group.points.forEach(p => {
      if (p.ref) return;
      ["L", "R"].forEach(side => {
        const key = `${p.id}_${side}`;
        const serie = records
          .map(r => (r.valores || {})[key])
          .filter(v => v !== undefined && v !== null && !isNaN(v));
        if (serie.length < 2) return; // hace falta más de un dato para ver tendencia
        container.appendChild(buildTrendCard(p, side, serie, group));
      });
    });
  });

  if (!container.children.length) {
    container.innerHTML = "<p class='muted'>Todavía no hay suficientes mediciones repetidas para calcular tendencias (hace falta al menos 2 por punto).</p>";
  }
}

function buildTrendCard(p, side, serie, group) {
  const card = document.createElement("div");
  card.className = "trend-card";

  const avg = serie.reduce((a, b) => a + b, 0) / serie.length;
  const avgDelta = avg - p.nominal;
  const highCount = serie.filter(v => v > p.nominal + p.tol).length;
  const lowCount = serie.filter(v => v < p.nominal - p.tol).length;

  let tendClass = "trend-ok", tendLabel = "Estable / dentro de tolerancia", sugerencia = "";
  if (highCount / serie.length >= 0.5) {
    tendClass = "trend-high";
    tendLabel = "Tendencia ALTA";
    sugerencia = `Ajustar ≈ -${Math.abs(avgDelta).toLocaleString("es-ES", { maximumFractionDigits: 1 })} mm`;
  } else if (lowCount / serie.length >= 0.5) {
    tendClass = "trend-low";
    tendLabel = "Tendencia BAJA";
    sugerencia = `Ajustar ≈ +${Math.abs(avgDelta).toLocaleString("es-ES", { maximumFractionDigits: 1 })} mm`;
  }

  const header = document.createElement("div");
  header.className = "trend-header";

  if (group && group.img && GROUP_IMAGES[group.img]) {
    const thumb = document.createElement("img");
    thumb.src = GROUP_IMAGES[group.img];
    thumb.className = "trend-thumb";
    thumb.alt = "Zona: " + group.name;
    thumb.addEventListener("click", () => openLightbox(GROUP_IMAGES[group.img], group.name));
    header.appendChild(thumb);
  }

  const titleBlock = document.createElement("div");
  titleBlock.className = "trend-title-block";
  titleBlock.innerHTML = `
    <p class="trend-id">${p.id} · ${side}</p>
    <p class="trend-group-name">${group ? group.name : ""}</p>
  `;
  header.appendChild(titleBlock);

  const badge = document.createElement("span");
  badge.className = `trend-badge ${tendClass}`;
  badge.textContent = tendLabel;
  header.appendChild(badge);

  card.appendChild(header);

  const sub = document.createElement("div");
  sub.className = "trend-sub";
  sub.textContent = `Nominal ${fmtTol(p)} · media últimas ${serie.length}: ${avg.toLocaleString("es-ES", { maximumFractionDigits: 1 })}${sugerencia ? " · " + sugerencia : ""} · valores: ${serie.map(v => v.toLocaleString("es-ES")).join("-")}`;
  card.appendChild(sub);

  const canvas = document.createElement("canvas");
  canvas.width = 600;
  canvas.height = 140;
  canvas.className = "trend-canvas";
  card.appendChild(canvas);
  drawSparkline(canvas, serie, p.nominal, p.tol);

  return card;
}

function drawSparkline(canvas, serie, nominal, tol) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const padding = 10;
  const min = Math.min(nominal - tol * 1.5, ...serie);
  const max = Math.max(nominal + tol * 1.5, ...serie);
  const range = (max - min) || 1;
  const stepX = (w - padding * 2) / Math.max(serie.length - 1, 1);
  const toY = v => h - padding - ((v - min) / range) * (h - padding * 2);
  const toX = i => padding + i * stepX;

  const yTop = toY(nominal + tol);
  const yBot = toY(nominal - tol);

  // Bandas: roja (alto) / verde (tolerancia) / azul (bajo)
  ctx.fillStyle = "rgba(220,38,38,0.12)";
  ctx.fillRect(padding, 0, w - padding * 2, yTop);
  ctx.fillStyle = "rgba(22,163,74,0.15)";
  ctx.fillRect(padding, yTop, w - padding * 2, yBot - yTop);
  ctx.fillStyle = "rgba(37,99,235,0.12)";
  ctx.fillRect(padding, yBot, w - padding * 2, h - yBot);

  // Línea nominal
  ctx.strokeStyle = "#16a34a";
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding, toY(nominal));
  ctx.lineTo(w - padding, toY(nominal));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#16a34a";
  ctx.font = "11px sans-serif";
  ctx.fillText(`nominal ${nominal.toLocaleString("es-ES")}`, padding + 4, toY(nominal) - 4);

  // Línea de datos
  ctx.strokeStyle = "#6b7280";
  ctx.lineWidth = 2;
  ctx.beginPath();
  serie.forEach((v, i) => {
    const x = toX(i), y = toY(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Puntos coloreados según tolerancia
  serie.forEach((v, i) => {
    const x = toX(i), y = toY(v);
    const color = v > nominal + tol ? "#dc2626" : (v < nominal - tol ? "#2563eb" : "#16a34a");
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    if (i === serie.length - 1) {
      ctx.font = "bold 12px sans-serif";
      const label = v.toLocaleString("es-ES");
      const labelY = y < h / 2 ? y + 16 : y - 10;
      ctx.textAlign = x > w - 40 ? "right" : "center";
      ctx.fillText(label, x, labelY);
      ctx.textAlign = "left";
    }
  });
}

/* ---------- Informe PDF (imprimible) ---------- */
function fmtValor(v) {
  if (v === undefined || v === null) return "";
  return v.toLocaleString("es-ES", { minimumFractionDigits: 0 });
}

function claseValor(v, nominal, tol) {
  if (v === undefined || v === null) return "";
  if (v > nominal + tol) return "pv-high";
  if (v < nominal - tol) return "pv-low";
  return "pv-ok";
}

function buildInformeSectionHtml(record, fechaTexto) {
  const groups = record.modelo === "B10" ? GROUPS_B10 : GROUPS_B05;
  const valores = record.valores || {};

  let rowsHtml = "";
  groups.forEach(group => {
    rowsHtml += `<tr class="pr-group-row"><td colspan="4" style="background:${group.color}">${group.name}</td></tr>`;
    group.points.forEach(p => {
      if (p.ref) {
        rowsHtml += `
          <tr>
            <td>${p.id}</td>
            <td>${fmtTol(p)}</td>
            <td colspan="2" class="pv-ref">REFERENTIEL</td>
          </tr>`;
      } else {
        const vl = valores[`${p.id}_L`];
        const vr = valores[`${p.id}_R`];
        rowsHtml += `
          <tr>
            <td>${p.id}</td>
            <td>${fmtTol(p)}</td>
            <td class="${claseValor(vl, p.nominal, p.tol)}">${fmtValor(vl)}</td>
            <td class="${claseValor(vr, p.nominal, p.tol)}">${fmtValor(vr)}</td>
          </tr>`;
      }
    });
  });

  return `
  <section class="pr-section">
    <h1>Mediciones Zeiss — ${record.modelo}</h1>
    <div class="pr-meta">
      FASE: <strong>${record.fase || "-"}</strong> &nbsp;·&nbsp;
      BDG: <strong>${record.bdg || "-"}</strong> &nbsp;·&nbsp;
      Fecha: <strong>${record.fecha || fechaTexto || "-"}</strong>
    </div>
    <div class="pr-meta">
      Cotas registradas: <strong>${record.totalCotas || 0}</strong> &nbsp;·&nbsp;
      Fuera de tolerancia: <strong>${record.fueraTolerancia || 0}</strong>
      (🔴 alto: ${record.fueraAlta || 0} &nbsp; 🔵 bajo: ${record.fueraBaja || 0})
    </div>
    <table class="pr-table">
      <thead><tr><th>Punto</th><th>Nominal ± Tol.</th><th>L</th><th>R</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </section>`;
}

function abrirInformeVentana(titulo, sectionsHtml) {
  const reportHtml = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${titulo}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; color: #111; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .pr-meta { font-size: 13px; margin-bottom: 6px; color: #333; }
  .pr-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
  .pr-table th, .pr-table td { border: 1px solid #999; padding: 5px 8px; text-align: center; }
  .pr-table th:first-child, .pr-table td:first-child { text-align: left; font-weight: 700; }
  .pr-group-row td { font-weight: 700; text-align: left; color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pv-ok { color: #16a34a; font-weight: 700; }
  .pv-high { color: #dc2626; font-weight: 700; }
  .pv-low { color: #2563eb; font-weight: 700; }
  .pv-ref { color: #999; font-style: italic; }
  .pr-actions { margin: 16px 0; }
  .pr-actions button {
    padding: 10px 18px; font-size: 15px; font-weight: 600; border-radius: 8px;
    border: none; background: #2563eb; color: #fff;
  }
  .pr-section { margin-bottom: 30px; }
  .pr-section:not(:first-of-type) { border-top: 3px solid #333; padding-top: 20px; }
  @media print {
    .pr-actions { display: none; }
    .pr-section:not(:first-of-type) { page-break-before: always; border-top: none; padding-top: 0; }
  }
</style>
</head>
<body>
  <div class="pr-actions"><button onclick="window.print()">Imprimir / Guardar como PDF</button></div>
  ${sectionsHtml}
</body>
</html>`;

  const blob = new Blob([reportHtml], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if (!win) {
    alert("El navegador ha bloqueado la ventana nueva. Permite las ventanas emergentes para este sitio e inténtalo de nuevo.");
  }
}

function generarInformePDF(record, fechaTexto) {
  try {
    abrirInformeVentana(
      `Informe Zeiss ${record.modelo} - BDG ${record.bdg || ""}`,
      buildInformeSectionHtml(record, fechaTexto)
    );
  } catch (err) {
    console.error(err);
    alert("Error generando el informe: " + err.message);
  }
}

function generarInformePDFMultiple(entries) {
  try {
    const sectionsHtml = entries.map(({ d, fecha }) => buildInformeSectionHtml(d, fecha)).join("\n");
    abrirInformeVentana(`Informe Zeiss — ${entries.length} carrocerías`, sectionsHtml);
  } catch (err) {
    console.error(err);
    alert("Error generando el informe combinado: " + err.message);
  }
}

/* ---------- Selección múltiple para envío ---------- */
function toggleSelectMode() {
  const list = document.getElementById("histList");
  const btn = document.getElementById("btnSelectMode");
  const active = list.classList.toggle("select-mode");
  btn.textContent = active ? "Cancelar selección" : "✉️ Enviar varias";
  if (!active) {
    list.querySelectorAll(".hist-select input").forEach(cb => (cb.checked = false));
  }
  updateSendBar();
}

function updateSendBar() {
  const list = document.getElementById("histList");
  const active = list.classList.contains("select-mode");
  const checked = Array.from(list.querySelectorAll(".hist-select input:checked"));
  const sendBar = document.getElementById("sendBar");
  const sendBtn = document.getElementById("btnEnviarSeleccion");
  sendBtn.textContent = `Enviar seleccionadas (${checked.length})`;
  sendBar.classList.toggle("active", active && checked.length > 0);
}

/* ---------- Eventos de pantalla ---------- */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-modelo]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.modelo = btn.dataset.modelo;
      state.editingRef = null;
      document.getElementById("modeloLabel").textContent = state.modelo;
      const hoy = new Date().toISOString().slice(0, 10);
      document.getElementById("fechaInput").value = hoy;
      show("screen-info");
    });
  });

  document.getElementById("btnAtras1").addEventListener("click", () => show("screen-modelo"));

  document.getElementById("btnContinuar").addEventListener("click", () => {
    state.fase = document.getElementById("faseInput").value.trim();
    state.bdg = document.getElementById("bdgInput").value.trim();
    state.fecha = document.getElementById("fechaInput").value;
    if (!state.bdg) {
      alert("Introduce al menos el BDG.");
      return;
    }
    state.editingRef = null;
    document.getElementById("topBar").textContent =
      `${state.modelo} · FASE ${state.fase || "-"} · BDG ${state.bdg}`;
    buildGrid();
    document.getElementById("saveMsg").textContent = "";
    document.getElementById("btnGuardar").textContent = "Guardar medición";
    show("screen-grid");
  });

  document.getElementById("btnAtras2").addEventListener("click", () => show("screen-info"));
  document.getElementById("btnGrafico").addEventListener("click", () => {
    cargarGrafico();
    show("screen-charts");
  });
  document.getElementById("btnAtrasCharts").addEventListener("click", () => show("screen-info"));
  document.getElementById("graficoN").addEventListener("change", cargarGrafico);
  document.getElementById("btnHistorial").addEventListener("click", () => {
    state.histFrom = "grid";
    cargarHistorial();
    show("screen-hist");
  });
  document.getElementById("btnHistorialInfo").addEventListener("click", () => {
    state.histFrom = "info";
    cargarHistorial();
    show("screen-hist");
  });
  document.getElementById("btnAtras3").addEventListener("click", () => show(state.histFrom === "info" ? "screen-info" : "screen-grid"));
  document.getElementById("btnSelectMode").addEventListener("click", toggleSelectMode);
  document.getElementById("btnEnviarSeleccion").addEventListener("click", () => {
    const list = document.getElementById("histList");
    const checked = Array.from(list.querySelectorAll(".hist-select input:checked"));
    const entries = checked.map(cb => historialActual[parseInt(cb.dataset.idx, 10)]);
    if (entries.length === 0) return;
    generarInformePDFMultiple(entries);
  });
  document.getElementById("btnGuardar").addEventListener("click", guardar);
  document.getElementById("lightbox").addEventListener("click", closeLightbox);
});
</script>

  .cota-input.high { background: var(--bad-bg); border-color: var(--bad); font-weight: 700; }
  .cota-input.low { background: var(--cold-bg); border-color: var(--cold); font-weight: 700; }
  #saveBar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); padding-top: 10px; }
  .save-msg { text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .ok-msg { color: var(--ok); font-weight: 600; }
  .bad-msg { color: var(--bad); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .hist-row { padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--card); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .hist-select { display: none; padding-top: 2px; }
  #histList.select-mode .hist-select { display: block; }
  .hist-select input { width: 20px; height: 20px; }
  .hist-info { flex: 1; min-width: 0; }
  .hist-btn-row { width: 100%; }
  .send-bar {
    display: none; position: sticky; bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg); padding: 10px 0;
  }
  .send-bar.active { display: block; }
  .send-bar .btn { width: 100%; padding: 14px; }
  .hist-btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .hist-edit-btn { flex: 1; padding: 10px; font-size: 14px; min-width: 90px; }
  .hist-pdf-btn { flex: 1; padding: 10px; font-size: 14px; min-width: 90px; }
  .hist-del-btn { flex: 0 0 auto; padding: 10px 14px; font-size: 14px; }
  .btn-danger { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }

  /* ---------- Tendencias / gráficos ---------- */
  .trend-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: var(--card); }
  .trend-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .trend-thumb { width: 56px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(0,0,0,0.25); flex-shrink: 0; cursor: pointer; }
  .trend-title-block { flex: 1; min-width: 0; }
  .trend-id { font-weight: 700; font-size: 14px; margin: 0; }
  .trend-group-name { font-size: 11px; color: var(--muted); margin: 0; }
  .trend-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .trend-badge.trend-ok { background: var(--ok-bg); color: var(--ok); }
  .trend-badge.trend-high { background: var(--bad-bg); color: var(--bad); }
  .trend-badge.trend-low { background: var(--cold-bg); color: var(--cold); }
  .trend-sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .trend-canvas { width: 100%; height: 140px; display: block; }
</style>
</head>
<body>

<div id="screen-modelo" class="screen active">
  <h1>Mediciones Zeiss</h1>
  <div class="subtitle">Selecciona el modelo</div>
  <div class="modelo-grid">
    <button class="modelo-btn" data-modelo="B10">B10</button>
    <button class="modelo-btn" data-modelo="B05">B05</button>
  </div>
</div>

<div id="screen-info" class="screen">
  <h1>Datos de la carrocería</h1>
  <div class="subtitle">Modelo: <strong id="modeloLabel"></strong></div>
  <div class="field">
    <label>FASE</label>
    <input id="faseInput" type="text" placeholder="Ej. PRE-COP, COP...">
  </div>
  <div class="field">
    <label>JSN / BDG</label>
    <input id="bdgInput" type="text" placeholder="Número de BDG">
  </div>
  <div class="field">
    <label>Fecha</label>
    <input id="fechaInput" type="date">
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnAtras1">Atrás</button>
    <button class="btn btn-primary" id="btnContinuar">Continuar</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnGrafico">📊 Ver tendencias del modelo</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnHistorialInfo">🕘 Ver historial</button>
  </div>
</div>

<div id="screen-charts" class="screen">
  <h1>Tendencias — <span id="chartsModelo"></span></h1>
  <div class="subtitle">Detecta si un punto llega sistemáticamente alto o bajo</div>
  <div class="field">
    <label>Analizar últimas</label>
    <select id="graficoN">
      <option value="5">5 mediciones</option>
      <option value="10" selected>10 mediciones</option>
      <option value="20">20 mediciones</option>
      <option value="50">50 mediciones</option>
    </select>
  </div>
  <div id="chartsContainer"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnAtrasCharts">Volver</button>
  </div>
</div>

<div id="screen-grid" class="screen">
  <div id="topBar"></div>
  <div id="grid"></div>
  <div id="saveBar">
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnAtras2">Atrás</button>
      <button class="btn btn-secondary" id="btnHistorial">Historial</button>
      <button class="btn btn-primary" id="btnGuardar">Guardar medición</button>
    </div>
    <div id="saveMsg" class="save-msg"></div>
  </div>
</div>

<div id="lightbox" class="lightbox">
  <div class="lightbox-title" id="lightboxTitle"></div>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-hint">Toca para cerrar</div>
</div>

<div id="screen-hist" class="screen">
  <h1>Historial</h1>
  <div class="subtitle">Últimas 20 mediciones — <span id="histModelo"></span></div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnSelectMode">✉️ Enviar varias</button>
  </div>
  <div id="histList"></div>
  <div id="sendBar" class="send-bar">
    <button class="btn btn-primary" id="btnEnviarSeleccion">Enviar seleccionadas (0)</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnAtras3">Volver a la medición</button>
  </div>
</div>

</body>
</html>
